<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japan 2026 Day Maps</title>
<meta name="description" content="Day-by-day street maps for the Japan trip, 19 Nov – 5 Dec 2026.">
<meta name="theme-color" content="#1e1b4b">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japan Maps">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --ink:#1b1c21; --muted:#5f6571; --line:#e2e0d9; --soft:#efede7;
  --head:#1e1b4b; --head-ink:#ffffff;
  --indigo:#4f46e5; --amber:#c26a04; --plum:#8e3b8a; --walk:#6b7280; --teal:#0d9488; --meal:#ea6c0a;
  --ok:#166534; --ok-bg:#e3f4e8; --warn:#8a4b00; --warn-bg:#fcefd6; --neutral:#4b5160; --neutral-bg:#ecebe6;
  --you:#1a73e8; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.06);
  --shop:#7c3aed; --shop-bg:#f1eafe; --quick:#15803d;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111318; --card:#1b1e25; --ink:#eceef2; --muted:#a0a7b4; --line:#2b303a; --soft:#232731;
    --head:#17153a;
    --indigo:#8b93ff; --amber:#f5a524; --plum:#d58ad1; --walk:#a3aab6; --teal:#2dd4bf; --meal:#fb923c;
    --ok:#7ee2a0; --ok-bg:#16301f; --warn:#fbc66a; --warn-bg:#3a2a0e; --neutral:#c4c9d2; --neutral-bg:#2a2e37;
    --you:#4c9bff; --shadow:0 1px 2px rgba(0,0,0,.4);
    --shop:#b794f6; --shop-bg:#2b2340; --quick:#4ade80;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
a{color:inherit}

/* Day strip */
header{flex:0 0 auto;background:var(--head);color:var(--head-ink);padding-top:env(safe-area-inset-top);z-index:2}
#chips{display:flex;gap:6px;overflow-x:auto;padding:6px max(10px,env(safe-area-inset-left)) 8px;scrollbar-width:none;scroll-snap-type:x proximity}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 12px;border-radius:22px;border:0;background:rgba(255,255,255,.1);color:#e7e6ff;
  font-size:14px;white-space:nowrap;scroll-snap-align:center;display:flex;align-items:center;gap:6px;cursor:pointer}
.chip b{font-weight:650;color:#fff}
.chip[aria-current="true"]{background:#fff;color:var(--head)}
.chip[aria-current="true"] b{color:var(--head)}
.chip .today{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#fbbf24;color:#1e1b4b;border-radius:6px;padding:1px 5px}

/* Map */
#mapwrap{flex:0 0 50%;position:relative;transition:flex-basis .25s ease;border-bottom:1px solid var(--line)}
body.bigmap #mapwrap{flex-basis:74%}
#map{position:absolute;inset:0;background:var(--soft);z-index:0}
.leaflet-container{font:inherit}
.mapbtns{position:absolute;right:max(10px,env(safe-area-inset-right));top:10px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.mbtn{width:44px;height:44px;border-radius:12px;border:0;background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25);
  display:grid;place-items:center;cursor:pointer}
.mbtn svg{width:22px;height:22px}
.mbtn.on{background:var(--you);color:#fff}
.mbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.leaflet-control-attribution{font-size:10px}
@media (prefers-color-scheme: dark){
  .leaflet-control-attribution{background:rgba(20,22,28,.75)!important;color:#aab}
  .leaflet-control-attribution a{color:#cfd3ff}
}

/* Markers */
.pin{width:44px;height:44px;display:grid;place-items:center}
.pin span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;
  background:var(--indigo);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.meal span{background:var(--meal)}
.pin.opt span{background:var(--card);color:var(--indigo);border:2.5px dashed var(--indigo)}
.pin.opt.meal span{color:var(--meal);border-color:var(--meal)}
.pin.active span{transform:scale(1.22);box-shadow:0 0 0 4px rgba(79,70,229,.35),0 1px 4px rgba(0,0,0,.35)}
.pin.base span{width:34px;height:34px;font-size:15px}
.pin.end span{background:var(--teal);font-size:12px}
.pin.small span{width:26px;height:26px;border-width:2px}
.pin.small svg{width:15px;height:15px}
.pin.shop span{background:var(--shop);color:#fff}
.pin.quick span{background:var(--quick);color:#fff}
@media (prefers-color-scheme: dark){ .pin.shop span,.pin.quick span{color:#14111f} }
.pin.small.active span{transform:scale(1.25)}
.pin.cluster span{width:auto;min-width:42px;height:28px;padding:0 8px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:3px;
  font-size:13px;font-weight:800;background:var(--card);color:var(--shop);border:2.5px solid var(--shop)}
.pin.cluster.quick span{color:var(--quick);border-color:var(--quick);background:var(--card)}
.pin.cluster svg{width:13px;height:13px}
@media (prefers-color-scheme: dark){ .pin.cluster span,.pin.cluster.quick span{background:var(--card)} .pin.cluster.shop span{color:var(--shop)} .pin.cluster.quick span{color:var(--quick)} }
.youdot{width:18px;height:18px;border-radius:50%;background:var(--you);border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 1px 3px rgba(0,0,0,.4)}

/* Route lines (colours via CSS so they follow the theme) */
.leg{fill:none;stroke-linecap:round;stroke-linejoin:round}
.leg-train{stroke:var(--indigo)} .leg-bus{stroke:var(--amber)} .leg-taxi{stroke:var(--plum)}
.leg-walk{stroke:var(--walk)} .leg-flight{stroke:var(--teal)}

/* Popups */
.leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border-radius:14px}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-content{margin:12px 14px;min-width:220px;font-size:14px}
.leaflet-container a.leaflet-popup-close-button{width:36px;height:36px;font-size:22px;line-height:34px;color:var(--muted)}
.pop .t{color:var(--muted);font-size:13px;font-weight:600}
.pop h4{margin:2px 28px 4px 0;font-size:16px;line-height:1.25}
.pop p{margin:4px 0 8px;color:var(--ink)}
.pop .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* List */
#list{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:14px max(14px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.kicker{font-size:13px;font-weight:650;color:var(--muted);letter-spacing:.01em}
h2{font-size:21px;line-height:1.2;margin:2px 0 6px}
.stay{color:var(--muted);margin-bottom:8px}
.stay b{color:var(--ink);font-weight:600}
.pills,.tags{display:flex;flex-wrap:wrap;gap:6px}
.pill,.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-size:13px;font-weight:600;padding:4px 10px;border:0;line-height:1.3}
.pill{min-height:32px}
.ok{background:var(--ok-bg);color:var(--ok)} .warn{background:var(--warn-bg);color:var(--warn)}
.neutral{background:var(--neutral-bg);color:var(--neutral)} .mealtag{background:var(--warn-bg);color:var(--meal)}
button.pill,button.tag{cursor:pointer;min-height:40px;padding:6px 12px}
.copyico{width:13px;height:13px;opacity:.75}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--indigo);border-color:transparent;color:#fff}
@media (prefers-color-scheme: dark){ .btn.primary{color:#0f1030} }
.btn.sm{min-height:40px;padding:0 12px;font-size:13px}
.nownext{margin:10px 0 2px;background:var(--card);border:1px solid var(--line);border-left:4px solid #fbbf24;border-radius:12px;padding:8px 12px;box-shadow:var(--shadow)}
.nownext div{display:flex;gap:8px;align-items:baseline;min-height:30px;cursor:pointer}
.nownext .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:38px;flex:0 0 auto}
ol.stops{list-style:none;margin:14px 0 0;padding:0}
.stop{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);
  scroll-margin:12px;transition:border-color .2s, box-shadow .2s;cursor:pointer}
.stop.active{border-color:var(--indigo);box-shadow:0 0 0 2px color-mix(in srgb,var(--indigo) 35%,transparent)}
.stop .num{flex:0 0 auto}
.stop .num span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--indigo);color:#fff}
.stop.meal .num span{background:var(--meal)}
.stop.opt .num span{background:transparent;color:var(--indigo);border:2.5px dashed var(--indigo)}
.stop.opt.meal .num span{color:var(--meal);border-color:var(--meal)}
.stop .body{min-width:0;flex:1}
.stop .time{font-size:13px;font-weight:700;color:var(--muted)}
.stop h3{font-size:16px;line-height:1.25;margin:1px 0 4px;overflow-wrap:anywhere}
.stop p{margin:0 0 8px;color:var(--ink);overflow-wrap:anywhere}
.stop .btns{margin:8px 0 0}
li.legrow{display:flex;align-items:center;gap:10px;padding:6px 4px 6px 14px;min-height:52px;position:relative}
li.legrow::before{content:"";position:absolute;left:29px;top:0;bottom:0;border-left:3px solid var(--c,var(--walk))}
li.legrow.walk::before{border-left-style:dotted} li.legrow.bus::before,li.legrow.taxi::before{border-left-style:dashed}
.legico{position:relative;z-index:1;width:32px;height:32px;flex:0 0 auto;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:17px}
.legtxt{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}
.legtxt b{color:var(--c);font-weight:700}
.legrow a.btn{flex:0 0 auto}
/* backups, nearby shops / quick bites */
.backups{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.backups b{color:var(--ink);font-weight:600}
.near{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;background:var(--soft);border:0;border-radius:10px;
  padding:9px 10px;margin-top:8px;min-height:44px;font-size:13.5px;line-height:1.35;cursor:pointer;color:var(--ink)}
.near b{font-weight:650}
.near small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.nico{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--shop);color:#fff}
.nico svg{width:14px;height:14px}
.near.quick .nico,.nico.quick{background:var(--quick)}
@media (prefers-color-scheme: dark){ .nico{color:#14111f} }
.near.active,.shoprow.active{box-shadow:0 0 0 2px var(--shop)}
/* layer toggles + category chips */
.layers{margin:16px 0 0;display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.lrow::-webkit-scrollbar{display:none}
.ltog{flex:0 0 auto;min-height:44px;padding:0 12px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);
  font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer}
.ltog i{width:11px;height:11px;border-radius:50%;background:var(--c);opacity:.3}
.ltog[aria-pressed="true"]{color:var(--ink);border-color:var(--c)}
.ltog[aria-pressed="true"] i{opacity:1}
.catchip{flex:0 0 auto;min-height:44px;padding:0 13px;border-radius:22px;border:1.5px solid var(--shop);background:transparent;color:var(--shop);font-size:13.5px;font-weight:600;cursor:pointer}
.catchip[aria-pressed="true"]{background:var(--shop);color:#fff}
@media (prefers-color-scheme: dark){ .catchip[aria-pressed="true"]{color:#14111f} }
.catbadge{background:var(--shop-bg);color:var(--shop)}
.visit{background:var(--neutral-bg);color:var(--neutral)}
/* shopping sections */
details.shopsec{margin:18px 0 0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
details.shopsec>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;font-weight:700;font-size:16px;cursor:pointer}
details.shopsec>summary::-webkit-details-marker{display:none}
details.shopsec>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details.shopsec[open]>summary::after{transform:rotate(-135deg)}
.count{font-size:12px;font-weight:700;background:var(--shop-bg);color:var(--shop);border-radius:999px;padding:2px 8px}
ul.shoplist{list-style:none;margin:0;padding:0 10px 10px}
.shoprow{display:flex;gap:10px;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:10px}
.shoprow h3{font-size:15px;margin:0 0 4px;line-height:1.25}
.shoprow p{margin:4px 0 0;font-size:13.5px}
.shoprow .price{color:var(--muted)}
.dayhdr{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:12px 6px 4px}
.empty{padding:10px 6px 4px;color:var(--muted);font-size:13.5px}
.pop .tags{margin:4px 0}
.pop .price{color:var(--muted);margin-top:0}
.foot{margin:22px 2px 0;font-size:12.5px;color:var(--muted)}
.foot p{margin:4px 0}
.reminders{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:12px 0}
.reminders li{margin:4px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:16px}
.legend .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);vertical-align:middle;margin-right:5px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid var(--c);vertical-align:middle;margin-right:5px}

/* Toast + dialog */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;
  background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;transition:.2s;pointer-events:none;z-index:2000;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);width:min(420px,calc(100vw - 24px));padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 6px;font-size:18px}
dialog p{margin:6px 0;color:var(--muted);font-size:14px}
dialog .btn{width:100%;justify-content:space-between}
dialog .col{display:flex;flex-direction:column;gap:8px;margin:12px 0}
dialog label{display:flex;gap:10px;align-items:center;min-height:44px;font-size:14px}
dialog input[type=checkbox]{width:22px;height:22px}
progress{width:100%;height:10px;accent-color:var(--indigo)}
.err{padding:24px;color:var(--muted)}
</style>
</head>
<body>
<header><nav id="chips" aria-label="Days"></nav></header>
<div id="mapwrap">
  <div id="map" role="region" aria-label="Map"></div>
  <div class="mapbtns">
    <button class="mbtn" id="btnLocate" aria-label="Show my location" title="Show my location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <button class="mbtn" id="btnFit" aria-label="Fit the whole day" title="Fit the whole day">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="mbtn" id="btnBig" aria-label="Bigger map" title="Bigger map" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M6 10l6-6 6 6"/></svg>
    </button>
  </div>
</div>
<main id="list" aria-live="polite"></main>

<dialog id="dlg">
  <h3>Offline maps</h3>
  <p>Saves the map around every stop, along walking routes, and each day's overview (works for light and dark mode, sharp at every zoom). The app and itinerary are already saved for offline use.</p>
  <p>Best done on Wi-Fi. Maps you've already viewed are saved automatically.</p>
  <div class="col">
    <button class="btn" data-scope="day" id="dlDay">This day <span></span></button>
    <button class="btn" data-scope="all" id="dlAll">All 17 days <span></span></button>
  </div>
  <progress id="dlProg" value="0" max="1" hidden></progress>
  <p id="dlStatus" aria-live="polite"></p>
  <div class="btns">
    <button class="btn sm" id="dlCancel" hidden>Stop</button>
    <button class="btn sm" id="dlClear">Clear saved maps</button>
    <button class="btn sm primary" id="dlClose">Close</button>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js" crossorigin=""></script>
<script>
"use strict";
/* ---------- constants ---------- */
// Base map: OpenFreeMap vector tiles (OpenStreetMap data, free, no API key), drawn by MapLibre GL
// under Leaflet. Labels are rewritten to English, falling back to romaji.
const OFM = 'https://tiles.openfreemap.org';
const STYLE_LIGHT = OFM + '/styles/liberty', STYLE_DARK = OFM + '/styles/dark';
const LABEL_EN = ['coalesce', ['get','name:en'], ['get','name:latin'], ''];  // English, else romaji, never Japanese
const ATTR = '<a href="https://openfreemap.org">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const TILE_CACHE = 'ofm-v1';   // must match sw.js
const MAX_TILES = 3000;
const DL_WORKERS = 3, DL_GAP_MS = 100;
const FONT_RANGES = ['0-255','256-511','512-767','7680-7935','8192-8447'];
// Vector tile URLs contain a data version; cache them version-free so saved maps survive updates (same rule in sw.js).
const canonTile = u => u.replace(/\/planet\/[^/]+\//, '/planet/v/');
const WALK_ROUTER = 'https://routing.openstreetmap.de/routed-foot/route/v1/foot/';
const MODES = {
  train:  {label:'Train',  icon:'🚆', travel:'transit', style:{weight:4}},
  bus:    {label:'Bus',    icon:'🚌', travel:'transit', style:{weight:4, dashArray:'9 8'}},
  taxi:   {label:'Taxi',   icon:'🚕', travel:'driving', style:{weight:4, dashArray:'12 7'}},
  walk:   {label:'Walk',   icon:'🚶', travel:'walking', style:{weight:5, dashArray:'0.1 9'}},
  flight: {label:'Flight', icon:'✈️', travel:null,      style:{weight:3}},
};
const BASES = [ // overview: matched to stop names in trip.json so edits flow through
  {city:'Osaka', dates:'19–22 Nov', day:1, match:'BON Condominium'},
  {city:'Kyoto', dates:'22–25 Nov', day:4, match:'Rinn Kamiebisu'},
  {city:'Kiso-Fukushima', dates:'25–27 Nov', day:7, match:'Kiso Mikawaya'},
  {city:'Takayama', dates:'27–29 Nov', day:9, match:'Sanmachi Suji'},
  {city:'Kanazawa', dates:'29 Nov–1 Dec', day:11, match:'Hotel Forza'},
  {city:'Kawaguchiko', dates:'1–3 Dec', day:13, match:'Kawaguchiko Hotel'},
  {city:'Tokyo', dates:'3–5 Dec', day:15, match:'APA Hotel'},
];
const CATS = ['ceramics','prints','antiques','screens','crafts'];
const CAT_LABEL = {ceramics:'Ceramics', prints:'Prints', antiques:'Antiques', screens:'Screens', crafts:'Crafts'};
const LAYERS = [['route','Route','indigo'],['meals','Meals','meal'],['quick','Quick stops','quick'],['shop','Shopping','shop']];
const SVG = {
  bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8h13l-1.2 12.5H6.7z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  food: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18M4.5 3v5a2.5 2.5 0 0 0 5 0V3M17 21V3c-2.2 0-3.5 2.4-3.5 5.5S14.8 13 17 13"/></svg>',
};
const MONTHS = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
const WORD_TIMES = [[/late afternoon/i,960],[/late morning/i,660],[/early/i,420],[/morning/i,540],[/midday/i,720],
  [/lunch/i,750],[/afternoon/i,840],[/evening/i,1110],[/night/i,1230]];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
};
const params = new URLSearchParams(location.search);
let trip = [], routes = {}, view = null, markers = [], extras = [], activeMk = null, activeEl = null;
const readJSON = k => { try { return JSON.parse(store.get(k)); } catch { return null; } };
const layers = Object.assign({route:true, meals:true, quick:true, shop:true}, readJSON('layers') || {});
let catOn = new Set(Array.isArray(readJSON('shopCats')) ? readJSON('shopCats') : CATS);
const shopVisible = sh => (sh.categories || []).some(c => catOn.has(c)) || !(sh.categories || []).length;

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function isoOf(d){ const [dd,mon,yy]=d.date.split(' '); return `${yy}-${String(MONTHS[mon]).padStart(2,'0')}-${dd.padStart(2,'0')}`; }
function shortDate(d){ return d.date.split(' ').slice(0,2).join(' '); }
function japanNow(){
  // ?now=2026-11-22T10:30 overrides the clock (for testing)
  const o = params.get('now');
  if (o && /^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(o)) return {iso:o.slice(0,10), mins:+o.slice(11,13)*60 + +o.slice(14,16)};
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
    .formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {iso:`${p.year}-${p.month}-${p.day}`, mins:+p.hour*60 + +p.minute};
}
function todayDay(){ const {iso}=japanNow(); const d=trip.find(d=>isoOf(d)===iso); return d ? d.day : null; }
const mapsSearch = s => `https://www.google.com/maps/search/?api=1&query=${enc(s.mapsQuery)}`;
function mapsDir(a, b){
  const m = MODES[b.arriveBy];
  if (!a || !m || !m.travel) return null;
  return `https://www.google.com/maps/dir/?api=1&origin=${enc(a.mapsQuery)}&destination=${enc(b.mapsQuery)}&travelmode=${m.travel}`;
}
function mapsDay(d){
  const q = []; for (const s of d.stops) if (q[q.length-1] !== s.mapsQuery) q.push(s.mapsQuery);
  if (q.length < 2) return `https://www.google.com/maps/search/?api=1&query=${enc(q[0]||'')}`;
  const mid = q.slice(1,-1).slice(0,9);
  return `https://www.google.com/maps/dir/?api=1&origin=${enc(q[0])}&destination=${enc(q[q.length-1])}` +
    (mid.length ? `&waypoints=${mid.map(enc).join('%7C')}` : '');
}
const CODE_RE = /\b([A-Z]{0,2}\d{5,})\b/;
const codeOf = s => (String(s).match(CODE_RE)||[])[1] || null;
const COPY_SVG = '<svg class="copyico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></svg>';
function tagClass(t){ return /^booked/i.test(t) ? 'ok' : /reserve|call|to book|to do/i.test(t) ? 'warn' : 'neutral'; }
function tagHtml(label, cls){
  const code = codeOf(label);
  return code ? `<button class="tag ${cls}" data-copy="${esc(code)}" aria-label="Copy ${esc(code)}">${esc(label)} ${COPY_SVG}</button>`
              : `<span class="tag ${cls}">${esc(label)}</span>`;
}
function stopClass(s){ return (s.meal?' meal':'') + (s.optional?' opt':''); }
const rkey = (a,b) => `${(+a.lat).toFixed(5)},${(+a.lng).toFixed(5)}>${(+b.lat).toFixed(5)},${(+b.lng).toFixed(5)}`;
function walkGeom(a,b){
  const k = rkey(a,b);
  if (routes[k]) return routes[k];
  const c = store.get('walk:'+k); if (c) { try { return JSON.parse(c); } catch {} }
  return null;
}
function estMinutes(t){
  const m = String(t||'').match(/(\d{1,2}):(\d{2})/); if (m) return +m[1]*60 + +m[2];
  for (const [re,v] of WORD_TIMES) if (re.test(t)) return v;
  return null;
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch{} ta.remove(); }
  toast(`Copied ${text}`);
}

/* ---------- map ---------- */
const map = L.map('map', {zoomControl:false, tap:false, worldCopyJump:false}).setView([35.5,137.5], 6);
map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
let gl = null, styleCache = {};
async function englishStyle(url){
  if (styleCache[url]) return styleCache[url];
  const st = await (await fetch(url)).json();
  for (const l of st.layers) { const tf = l.layout && l.layout['text-field']; if (tf && /name/.test(JSON.stringify(tf))) l.layout['text-field'] = LABEL_EN; }
  return (styleCache[url] = st);
}
async function setBase(){
  try {
    const st = await englishStyle(darkMQ.matches ? STYLE_DARK : STYLE_LIGHT);
    if (!gl) gl = L.maplibreGL({style: st, attribution: ATTR, interactive: false}).addTo(map);
    else gl.getMaplibreMap().setStyle(st);
  } catch (e) { console.warn('base map unavailable', e); }
}
setBase();
darkMQ.addEventListener?.('change', setBase);
const lineLayer = L.layerGroup().addTo(map), markerLayer = L.layerGroup().addTo(map), youLayer = L.layerGroup().addTo(map);
let dayBounds = null;
function fitDay(animate){ if (dayBounds) map.fitBounds(dayBounds, {paddingTopLeft:[36,36], paddingBottomRight:[64,30], maxZoom:16, animate}); }

function pinIcon(label, cls, dx=0, dy=0, html){
  return L.divIcon({className:'', html:`<div class="pin${cls}"><span>${html ?? esc(label)}</span></div>`, iconSize:[44,44], iconAnchor:[22-dx,22-dy], popupAnchor:[dx,dy-(cls.includes('small')?12:16)]});
}
const numIconFn = (label, cls) => (dx, dy, act) => pinIcon(label, cls + (act ? ' active' : ''), dx, dy);
const shopIconFn = sh => (dx, dy, act) => pinIcon('', ' small shop' + (act ? ' active' : ''), dx, dy, sh.visit === 'see' ? SVG.eye : SVG.bag);
const quickIconFn = () => (dx, dy, act) => pinIcon('', ' small quick' + (act ? ' active' : ''), dx, dy, SVG.food);
function makeMarker(ll, iconFn, opts){
  const mk = L.marker(ll, {icon: iconFn(0, 0, false), keyboard: true, ...opts});
  mk._iconFn = iconFn; mk._dx = 0; mk._dy = 0; return mk;
}
/* Markers that overlap on screen (same station visited twice, or close stops at a
   low zoom) are fanned out side by side so every number stays tappable. Re-run on zoom. */
const GAP = 34;
function layout(pts, groups){
  const pos = pts.map(p=>[p.x,p.y]);
  for (const g of groups) {
    if (g.length < 2) continue;
    let cx = g.reduce((a,i)=>a+pts[i].x,0)/g.length, cy = g.reduce((a,i)=>a+pts[i].y,0)/g.length;
    const perRow = Math.min(g.length, 6), rows = Math.ceil(g.length/perRow);
    // keep a fanned-out group inside the visible map (leave room for the buttons on the right)
    const sz = map.getSize(), hw = (perRow-1)/2*GAP + 22, hh = (rows-1)/2*GAP + 22;
    if (cx >= 0 && cx <= sz.x && cy >= 0 && cy <= sz.y) {
      cx = Math.min(Math.max(cx, hw), Math.max(hw, sz.x - 58 - hw));
      cy = Math.min(Math.max(cy, hh), Math.max(hh, sz.y - hh));
    }
    g.forEach((i,j)=>{ const row=Math.floor(j/perRow), col=j%perRow, inRow=Math.min(perRow, g.length-row*perRow);
      pos[i] = [cx + (col-(inRow-1)/2)*GAP, cy + (row-(rows-1)/2)*GAP]; });
  }
  return pos;
}
const clusterLayer = L.layerGroup().addTo(map);
/* 3+ overlapping shop (or quick-stop) pins collapse into one count bubble; tap it to zoom in. */
function clusterExtras(){
  clusterLayer.clearLayers();
  const out = [];
  for (const kind of ['shop', 'quick']) {
    const ex = extras.filter(e => e.kind === kind && e.mk._vis);
    const pts = ex.map(e => map.latLngToContainerPoint(e.mk.getLatLng()));
    const parent = ex.map((_, i) => i), find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
    for (let i = 0; i < ex.length; i++) for (let j = i + 1; j < ex.length; j++) if (pts[i].distanceTo(pts[j]) < 30) parent[find(i)] = find(j);
    const groups = new Map(); ex.forEach((e, i) => { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(e); });
    for (const g of groups.values()) {
      const big = g.length >= 3 && !g.some(e => e.mk === activeMk);
      g.forEach(e => { if (big) markerLayer.removeLayer(e.mk); else if (!markerLayer.hasLayer(e.mk)) markerLayer.addLayer(e.mk); });
      if (!big) continue;
      const b = L.latLngBounds(g.map(e => e.mk.getLatLng()));
      const fn = (dx, dy) => pinIcon('', ` small cluster ${kind}`, dx, dy, `${kind === 'shop' ? SVG.bag : SVG.food}<b>${g.length}</b>`);
      const cm = makeMarker(b.getCenter(), fn, {zIndexOffset:60, title:`${g.length} ${kind === 'shop' ? 'shops' : 'quick bites'} — tap to zoom in`})
        .on('click', () => map.fitBounds(b.pad(0.4), {maxZoom:18, paddingTopLeft:[40,40], paddingBottomRight:[70,40]}));
      clusterLayer.addLayer(cm); out.push(cm);
    }
  }
  return out;
}
function declutter(){
  const clusters = clusterExtras();
  const vis = markers.concat(extras.map(e=>e.mk)).filter(m=>markerLayer.hasLayer(m)).concat(clusters);
  if (!vis.length) return;
  const pts = vis.map(m=>map.latLngToContainerPoint(m.getLatLng())), n = pts.length;
  const parent = pts.map((_,i)=>i), find = i => parent[i]===i ? i : (parent[i]=find(parent[i]));
  const near = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]) < 31;
  let pos = pts.map(p=>[p.x,p.y]), groups;
  for (let pass=0; pass<6; pass++) {           // merge groups until nothing overlaps
    let merged = false;
    for (let i=0;i<n;i++) for (let j=i+1;j<n;j++) if (find(i)!==find(j) && near(pos[i],pos[j])) { parent[find(i)] = find(j); merged = true; }
    const m = new Map(); for (let i=0;i<n;i++){ const r=find(i); if(!m.has(r)) m.set(r,[]); m.get(r).push(i); }
    groups = [...m.values()]; pos = layout(pts, groups);
    if (!merged) break;
  }
  vis.forEach((mk,i)=>{
    const dx = Math.round(pos[i][0]-pts[i].x), dy = Math.round(pos[i][1]-pts[i].y);
    if (mk._dx===dx && mk._dy===dy) return;
    mk._dx = dx; mk._dy = dy; mk.setIcon(mk._iconFn(dx, dy, mk === activeMk));
  });
}
map.on('zoomend', declutter);
function drawLeg(a, b, geom){
  const m = MODES[b.arriveBy]; if (!m) return null;
  const pts = geom || [[a.lat,a.lng],[b.lat,b.lng]];
  return L.polyline(pts, {className:`leg leg-${b.arriveBy}`, interactive:false, opacity:.9, lineCap:'round', ...m.style}).addTo(lineLayer);
}

/* ---------- rendering ---------- */
function renderChips(){
  const today = todayDay();
  const chips = [`<button class="chip" data-v="overview"><b>Trip overview</b></button>`, `<button class="chip" data-v="shopping"><b>🛍 Shopping</b></button>`]
    .concat(trip.map(d=>`<button class="chip" data-v="${d.day}" id="chip-${d.day}"><b>${esc(shortDate(d))}</b> · ${esc(d.city)}${d.day===today?' <span class="today">Today</span>':''}</button>`));
  $('#chips').innerHTML = chips.join('');
}
function markChip(){
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-current', String(c.dataset.v===String(view))));
  const cur = document.querySelector('.chip[aria-current="true"]');
  cur?.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
}

function popupHtml(d, i){
  const s = d.stops[i], prev = d.stops[i-1], dir = mapsDir(prev, s);
  return `<div class="pop"><div class="t">${esc(s.n)} · ${esc(s.time)}</div><h4>${esc(s.name)}</h4>
    ${s.notes?`<p>${esc(s.notes)}</p>`:''}
    <div class="acts"><a class="btn sm primary" href="${mapsSearch(s)}" target="_blank" rel="noopener">Open in Maps</a>
    ${dir?`<a class="btn sm" href="${dir}" target="_blank" rel="noopener">Directions</a>`:''}</div></div>`;
}

const walkDir = (a, b) => `https://www.google.com/maps/dir/?api=1&origin=${enc(a.mapsQuery)}&destination=${enc(b.mapsQuery)}&travelmode=walking`;
const visitLabel = v => v === 'see' ? 'See' : v === 'buy' ? 'Buy' : 'See & buy';
const catBadges = sh => (sh.categories || []).map(c => `<span class="tag catbadge">${esc(CAT_LABEL[c] || c)}</span>`).join('') + `<span class="tag visit">${sh.visit === 'see' ? SVG.eye.replace('<svg', '<svg class="copyico"') : SVG.bag.replace('<svg', '<svg class="copyico"')} ${visitLabel(sh.visit)}</span>`;
function nearOf(d, x){ return d.stops.find(s => s.n === x.nearStop); }
function placeActs(d, x){
  const near = nearOf(d, x), dir = near && near.mapsQuery !== x.mapsQuery ? walkDir(near, x) : null;
  return `<div class="acts"><a class="btn sm primary" href="${mapsSearch(x)}" target="_blank" rel="noopener">Open in Maps</a>
    ${dir ? `<a class="btn sm" href="${dir}" target="_blank" rel="noopener" aria-label="Walking directions from stop ${esc(near.n)}">🚶 From stop ${esc(near.n)}</a>` : ''}</div>`;
}
function shopPopup(d, sh, j, tripWide){
  const near = nearOf(d, sh);
  return `<div class="pop"><div class="t">${tripWide ? `Day ${d.day} · ${esc(d.city)}` : 'Shopping'}${near ? ` · near ${esc(near.n)}. ${esc(near.name)}` : ''}</div>
    <h4>${esc(sh.name)}</h4><div class="tags">${catBadges(sh)}</div>
    ${sh.whatToFind ? `<p>${esc(sh.whatToFind)}</p>` : ''}${sh.priceRange ? `<p class="price">💴 ${esc(sh.priceRange)}</p>` : ''}
    ${sh.notes ? `<p>${esc(sh.notes)}</p>` : ''}${placeActs(d, sh)}
    ${tripWide ? `<div class="acts"><button class="btn sm" data-goshop="${d.day}:${j}">Open day ${d.day} →</button></div>` : ''}</div>`;
}
function quickPopup(d, q){
  const near = nearOf(d, q);
  return `<div class="pop"><div class="t">Quick bite${near ? ` · near ${esc(near.n)}. ${esc(near.name)}` : ''}</div><h4>${esc(q.name)}</h4>
    ${q.whatToEat ? `<p>${esc(q.whatToEat)}</p>` : ''}${q.notes ? `<p>${esc(q.notes)}</p>` : ''}${placeActs(d, q)}</div>`;
}
function addExtras(d, kinds, tripWide){
  if (kinds.includes('shop')) (d.shopStops || []).forEach((sh, j) => {
    const e = {kind:'shop', day:d.day, j, data:sh};
    e.mk = makeMarker([sh.lat, sh.lng], shopIconFn(sh), {zIndexOffset:50, title:sh.name, alt:`Shop: ${sh.name}`})
      .bindPopup(() => shopPopup(d, sh, j, tripWide), {autoPanPadding:[40,40], maxWidth:290})
      .on('click', () => activate(e.mk, extraEl(e), true));
    extras.push(e);
  });
  if (kinds.includes('quick')) (d.quickStops || []).forEach((q, j) => {
    const e = {kind:'quick', day:d.day, j, data:q};
    e.mk = makeMarker([q.lat, q.lng], quickIconFn(), {zIndexOffset:40, title:q.name, alt:`Quick bite: ${q.name}`})
      .bindPopup(() => quickPopup(d, q), {autoPanPadding:[40,40], maxWidth:290})
      .on('click', () => activate(e.mk, extraEl(e), true));
    extras.push(e);
  });
}
function extraEl(e){
  return document.querySelector(view === 'shopping' ? `.shoprow[data-day="${e.day}"][data-j="${e.j}"]` : `.near[data-kind="${e.kind}"][data-j="${e.j}"]`);
}
/* Which markers/lines are on the map, from the layer toggles and category filter. */
function applyLayers(){
  const dayView = typeof view === 'number';
  if (!dayView || layers.route) lineLayer.addTo(map); else map.removeLayer(lineLayer);
  const set = (mk, on) => { on = on || mk === activeMk; if (on && !markerLayer.hasLayer(mk)) markerLayer.addLayer(mk); else if (!on && markerLayer.hasLayer(mk)) markerLayer.removeLayer(mk); };
  markers.forEach(mk => set(mk, !dayView || (mk._meal ? layers.meals : layers.route)));
  extras.forEach(e => { e.mk._vis = e.mk === activeMk || (e.kind === 'quick' ? layers.quick : (view === 'shopping' || layers.shop) && shopVisible(e.data));
    if (!e.mk._vis) markerLayer.removeLayer(e.mk); });
  declutter();
}
function layersHtml(withToggles){
  const tog = withToggles ? `<div class="lrow" role="group" aria-label="Map layers">${LAYERS.map(([k,l,c]) =>
      `<button class="ltog" data-layer="${k}" aria-pressed="${layers[k]}" style="--c:var(--${c})"><i></i>${l}</button>`).join('')}</div>` : '';
  const cats = `<div class="lrow cats" role="group" aria-label="Shop categories"${withToggles && !layers.shop ? ' hidden' : ''}>${CATS.map(c =>
      `<button class="catchip" data-cat="${c}" aria-pressed="${catOn.has(c)}">${CAT_LABEL[c]}</button>`).join('')}</div>`;
  return `<div class="layers">${tog}${cats}</div>`;
}
/* Category filter also hides matching rows in the lists (no re-render, keeps scroll). */
function filterShopEls(){
  document.querySelectorAll('[data-cats]').forEach(el => { el.hidden = !el.dataset.cats.split(' ').some(c => catOn.has(c)); });
  document.querySelectorAll('details.shopsec').forEach(sec => {
    const rows = [...sec.querySelectorAll('.shoprow')], n = rows.filter(r => !r.hidden).length;
    const c = sec.querySelector('.count'); if (c) c.textContent = n;
    sec.querySelectorAll('.dayhdr').forEach(h => { let el = h.nextElementSibling, any = false; while (el && el.classList.contains('shoprow')) { any ||= !el.hidden; el = el.nextElementSibling; } h.hidden = !any; });
    const em = sec.querySelector('.empty'); if (em) em.hidden = n > 0 || !rows.length;
  });
}
function shopRowHtml(d, sh, j, withDay){
  const near = nearOf(d, sh);
  return `<li class="shoprow" data-day="${d.day}" data-j="${j}" data-cats="${esc((sh.categories || []).join(' '))}">
    <span class="nico">${sh.visit === 'see' ? SVG.eye : SVG.bag}</span>
    <div>${withDay ? `<div class="time">Day ${d.day} · ${esc(d.weekday)} ${esc(shortDate(d))} · ${esc(d.city)}</div>` : ''}
      <h3>${esc(sh.name)}</h3><div class="tags">${catBadges(sh)}</div>
      ${sh.whatToFind ? `<p>${esc(sh.whatToFind)}</p>` : ''}
      <p class="price">${sh.priceRange ? `💴 ${esc(sh.priceRange)}` : ''}${near ? ` · near ${esc(near.n)}. ${esc(near.name)}` : ''}</p>
      ${sh.notes ? `<p>${esc(sh.notes)}</p>` : ''}</div></li>`;
}

function renderDay(d){
  lineLayer.clearLayers(); markerLayer.clearLayers(); clusterLayer.clearLayers(); markers = []; extras = []; activeMk = activeEl = null;
  const st = d.stops;
  // route lines
  st.forEach((s,i)=>{
    if (!i) return; const a = st[i-1];
    if (Math.abs(a.lat-s.lat)<1e-6 && Math.abs(a.lng-s.lng)<1e-6) return;
    const geom = s.arriveBy==='walk' ? walkGeom(a,s) : null;
    const line = drawLeg(a, s, geom);
    if (s.arriveBy==='walk' && !geom) fetchWalk(a, s, line, d.day);
  });
  // markers
  st.forEach((s,i)=>{
    const mk = makeMarker([s.lat,s.lng], numIconFn(s.n, stopClass(s)), {zIndexOffset: 100+i, title:`${s.n}. ${s.name}`, alt:`Stop ${s.n}`})
      .bindPopup(()=>popupHtml(d,i), {autoPanPadding:[40,40], maxWidth:290})
      .on('click', ()=>selectStop(i, true));
    mk._meal = !!s.meal; markers.push(mk);
  });
  addExtras(d, ['shop', 'quick'], false);
  dayBounds = L.latLngBounds(st.map(s=>[s.lat,s.lng]));
  fitDay(false); applyLayers();

  // list
  const isToday = d.day === todayDay();
  const legs = st.map((s,i)=>{
    if (!i || !s.arriveBy) return '';
    const m = MODES[s.arriveBy] || {label:s.arriveBy, icon:'•'}, dir = mapsDir(st[i-1], s);
    return `<li class="legrow ${esc(s.arriveBy)}" style="--c:var(--${s.arriveBy==='train'?'indigo':s.arriveBy==='bus'?'amber':s.arriveBy==='taxi'?'plum':s.arriveBy==='flight'?'teal':'walk'})">
      <span class="legico" aria-hidden="true">${m.icon}</span>
      <span class="legtxt"><b>${esc(m.label)}</b>${s.legNote?` · ${esc(s.legNote)}`:''}</span>

  let cur = -1; est.forEach((v,i)=>{ if (v!=null && v<=now) cur=i; });

/* ---------- live walking geometry for legs not in routes.json ---------- */
async function fetchWalk(a, b, line, dayN){
  if (!navigator.onLine || map.distance([a.lat,a.lng],[b.lat,b.lng]) > 12000) return;
  try {
    const r = await fetch(`${WALK_ROUTER}${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`);
    if (!r.ok) return;
    const j = await r.json(); const c = j.routes?.[0]?.geometry?.coordinates; if (!c) return;
    const pts = c.map(([x,y])=>[+y.toFixed(5), +x.toFixed(5)]);
    store.set('walk:'+rkey(a,b), JSON.stringify(pts));
    if (view === dayN && line) line.setLatLngs(pts);
  } catch {}
}

/* ---------- offline tiles ---------- */
const lon2x = (lng,z) => Math.floor((lng+180)/360*2**z);
const lat2y = (lat,z) => { const r=lat*Math.PI/180; return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z); };
function addBox(set, s, w, n, e, z){
  const x0=lon2x(w,z), x1=lon2x(e,z), y0=lat2y(n,z), y1=lat2y(s,z);
  for (let x=x0;x<=x1;x++) for (let y=y0;y<=y1;y++) set.add(`${z}/${x}/${y}`);
}
function addAround(set, lat, lng, km, z){ const dl=km/111, dg=km/(111*Math.cos(lat*Math.PI/180)); addBox(set, lat-dl, lng-dg, lat+dl, lng+dg, z); }
const RADII = {14:1.0, 13:2.2, 12:4.5, 11:8};   // vector tiles stop at z14 and stay sharp when zoomed further
function dayTiles(d, set=new Set()){
  const st = d.stops;
  for (const s of st) for (const z in RADII) addAround(set, s.lat, s.lng, RADII[z], +z);
  for (const x of [...(d.quickStops || []), ...(d.shopStops || [])]) { addAround(set, x.lat, x.lng, .6, 14); addAround(set, x.lat, x.lng, 1.5, 13); }
  st.forEach((s,i)=>{ // walking routes: tiles along the path
    if (!i || s.arriveBy!=='walk') return;
    const g = walkGeom(st[i-1], s) || [[st[i-1].lat,st[i-1].lng],[s.lat,s.lng]];
    for (let k=1;k<g.length;k++){ const [a1,b1]=g[k-1],[a2,b2]=g[k]; const steps=Math.ceil(map.distance([a1,b1],[a2,b2])/200)||1;
      for (let t=0;t<=steps;t++){ const la=a1+(a2-a1)*t/steps, lo=b1+(b2-b1)*t/steps; addAround(set,la,lo,.35,14); } }
  });
  const b = L.latLngBounds(st.map(s=>[s.lat,s.lng])).pad(0.15);
  const fz = Math.min(14, map.getBoundsZoom(b));
  for (let z=5; z<=fz; z++) addBox(set, b.getSouth(), b.getWest(), b.getNorth(), b.getEast(), z);
  return set;
}
function tileList(scope){
  const set = new Set();
  if (scope==='day' && typeof view==='number') dayTiles(trip.find(d=>d.day===view), set);
  else trip.forEach(d=>dayTiles(d, set));
  return [...set];
}
async function assetUrls(keys){
  // vector tiles (+ the shaded-relief raster used at low zoom), fonts and sprites
  const tj = await (await fetch(OFM + '/planet')).json(), tpl = tj.tiles[0];
  const urls = keys.map(k => tpl.replace('{z}/{x}/{y}', k));
  keys.forEach(k => { if (+k.split('/')[0] <= 6) urls.push(`${OFM}/natural_earth/ne2sr/${k}.png`); });
  const st = await englishStyle(STYLE_LIGHT), fonts = new Set();
  for (const u of [STYLE_LIGHT, STYLE_DARK]) (await englishStyle(u)).layers.forEach(l => { const f = l.layout && l.layout['text-font']; if (Array.isArray(f)) fonts.add(f.join(',')); });
  for (const f of fonts) for (const r of FONT_RANGES) urls.push(st.glyphs.replace('{fontstack}', encodeURIComponent(f)).replace('{range}', r));
  for (const sfx of ['.json', '.png', '@2x.json', '@2x.png']) urls.push(st.sprite + sfx);
  return urls;
}
let dlAbort = false, dlBusy = false;
async function cacheStats(){
  try { const c = await caches.open(TILE_CACHE); const n = (await c.keys()).length;
    let est = ''; if (navigator.storage?.estimate) { const e = await navigator.storage.estimate(); est = ` · app storage ${(e.usage/1048576).toFixed(0)} MB`; }
    return `${n.toLocaleString()} map files saved${est}`; } catch { return 'Offline storage not available in this browser'; }
}
async function openOffline(){
  const dlg = $('#dlg');
  $('#dlDay').hidden = typeof view !== 'number';
  const nd = typeof view==='number' ? tileList('day').length : 0, na = tileList('all').length;
  $('#dlDay span').textContent = `~${nd.toLocaleString()} tiles`;
  $('#dlAll span').textContent = `~${Math.min(na,MAX_TILES).toLocaleString()} tiles`;
  if (!dlBusy) $('#dlStatus').textContent = await cacheStats();
  dlg.showModal();
}
async function download(scope){
  if (dlBusy) return; if (!('caches' in window)) return toast('Offline storage not supported here');
  dlBusy = true; dlAbort = false;
  try { await navigator.storage?.persist?.(); } catch {}
  const prog = $('#dlProg'), status = $('#dlStatus');
  let jobs;
  try { jobs = await assetUrls(tileList(scope).slice(0, MAX_TILES)); }
  catch { dlBusy = false; status.textContent = 'Could not reach the map server. Try again when online.'; return; }
  const c = await caches.open(TILE_CACHE);
  prog.hidden = false; prog.max = jobs.length; prog.value = 0; $('#dlCancel').hidden = false;
  let done = 0, saved = 0, failed = 0, bytes = 0, idx = 0;
  async function worker(){
    while (idx < jobs.length && !dlAbort) {
      const url = jobs[idx++], key = canonTile(url);
      try {
        if (!(await c.match(key))) {
          const r = await fetch(url, {mode:'cors', credentials:'omit'});
          if (r.ok) { const blob = await r.blob(); bytes += blob.size; await c.put(key, new Response(blob, {headers:{'Content-Type': r.headers.get('Content-Type') || 'application/octet-stream'}})); saved++; }
          else if (r.status !== 404) failed++;   // 404 = empty sea tile, fine
          await new Promise(res=>setTimeout(res, DL_GAP_MS)); // be gentle with the free tile server
        }
      } catch { failed++; }
      done++;
      if (done % 10 === 0 || done === jobs.length) { prog.value = done; status.textContent = `${done.toLocaleString()} / ${jobs.length.toLocaleString()} tiles · ${(bytes/1048576).toFixed(1)} MB new${failed?` · ${failed} failed`:''}`; }
    }
  }
  await Promise.all(Array.from({length:DL_WORKERS}, worker));
  dlBusy = false; $('#dlCancel').hidden = true;
  status.textContent = (dlAbort ? 'Stopped. ' : 'Done. ') + `${saved.toLocaleString()} new tiles (${(bytes/1048576).toFixed(1)} MB)${failed?`, ${failed} failed (try again on Wi-Fi)`:''}. ` + await cacheStats();
  if (!dlAbort && !failed) toast('Maps saved for offline use');
}
$('#dlg').addEventListener('click', e=>{ const b = e.target.closest('[data-scope]'); if (b) download(b.dataset.scope); });
$('#dlCancel').addEventListener('click', ()=>{ dlAbort = true; });
$('#dlClose').addEventListener('click', ()=>$('#dlg').close());
$('#dlClear').addEventListener('click', async ()=>{
  if (dlBusy || !confirm('Delete all saved map tiles?')) return;
  try { await caches.delete(TILE_CACHE); } catch {}
  $('#dlStatus').textContent = await cacheStats();
});

/* ---------- boot ---------- */
async function loadJSON(url){ const r = await fetch(url); if (!r.ok) throw new Error(url+' '+r.status); return r.json(); }
function initialView(){
  const h = fromHash(); if (h !== null) return h;
  const t = todayDay(); if (t) return t;
  const last = +store.get('lastDay'); if (last && trip.some(d=>d.day===last)) return last;
  return trip[0].day;
}
(async ()=>{
  try {
    [trip, routes] = await Promise.all([loadJSON('trip.json'), loadJSON('routes.json').catch(()=>({}))]);
  } catch (e) {
    $('#list').innerHTML = `<div class="err">Couldn't load trip.json. If you just edited it, check it is valid JSON.<br><small>${esc(e.message)}</small></div>`; return;
  }
  renderChips(); show(initialView());
  setInterval(()=>{ if (typeof view==='number') { const d = trip.find(x=>x.day===view); if (d && d.day===todayDay()) updateNowNext(d); } }, 60000);
  // pick up edits to trip.json without waiting for the service worker's background refresh
  if (navigator.onLine) fetch('trip.json?fresh=1', {cache:'no-store'}).then(r=>r.ok?r.text():null).then(t=>{
    if (!t) return; let fresh; try { fresh = JSON.parse(t); } catch { return; }
    if (JSON.stringify(fresh) !== JSON.stringify(trip)) { trip = fresh; renderChips(); show(fromHash() ?? view); toast('Itinerary updated'); }
  }).catch(()=>{});
})();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
